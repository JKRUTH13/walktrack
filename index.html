<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalkTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #map { height: 100vh; }
    .leaflet-container { background: #dfeaf5; }
    .pulse {
      width: 18px; height: 18px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
      70% { box-shadow: 0 0 0 16px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
  </style>
</head>
<body class="bg-slate-100">
  <div class="flex flex-col h-screen">
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm z-20">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500 text-white p-2 rounded-xl">
          <i class="fa-solid fa-person-walking text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg">WalkTrack</h1>
          <p class="text-xs text-slate-500">Route planner and walking tracker</p>
        </div>
      </div>
      <div class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Leg <span id="trip-leg-indicator">1</span></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <aside class="w-full max-w-md bg-white border-r border-slate-200 p-4 space-y-4 overflow-y-auto">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Start</label>
          <input id="input-start" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="Start location" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Destination</label>
          <input id="input-end" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="End location" />
        </div>

        <div class="flex gap-2">
          <button id="btn-calc-route" class="flex-1 bg-slate-800 text-white py-2 rounded-xl font-semibold">Calculate Route</button>
          <button id="btn-clear-end" class="bg-slate-200 text-slate-700 px-3 rounded-xl">Clear</button>
        </div>

        <div id="route-summary-card" class="hidden rounded-2xl border border-emerald-200 bg-emerald-50 p-3">
          <div class="flex justify-between items-center pb-2 border-b border-emerald-200">
            <span class="text-xs font-bold uppercase text-emerald-700">Route</span>
            <span id="summary-distance" class="font-black text-emerald-700">0.0 km</span>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
            <div>
              <div class="text-slate-500">Est. time</div>
              <div id="summary-time" class="font-bold text-slate-700">0 mins</div>
            </div>
            <div>
              <div class="text-slate-500">Est. steps</div>
              <div id="summary-steps" class="font-bold text-slate-700">0</div>
            </div>
          </div>
        </div>

        <div class="flex gap-2">
          <button id="btn-start-pause" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold">Start Walk</button>
          <button id="btn-stop" class="hidden bg-red-600 text-white px-4 py-2 rounded-xl font-bold">Finish</button>
        </div>

        <button id="btn-next-leg" class="w-full bg-slate-200 text-slate-800 py-2 rounded-xl font-semibold">Set End as New Start</button>
      </aside>

      <main class="relative flex-1">
        <div id="map"></div>
      </main>
    </div>
  </div>

  <div id="arrival-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex justify-center mb-4">
        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl">🏆</div>
      </div>
      <h2 class="text-center text-2xl font-black text-slate-800">Destination Reached!</h2>
      <p class="text-center text-sm text-slate-500 mt-2">Great job — your walk leg is complete.</p>

      <div class="mt-4 bg-slate-50 rounded-2xl p-3 text-sm space-y-2 border border-slate-200">
        <div class="flex justify-between"><span>Distance</span><strong id="modal-dist">0.0 km</strong></div>
        <div class="flex justify-between"><span>Time</span><strong id="modal-time">00:00</strong></div>
        <div class="flex justify-between"><span>Steps</span><strong id="modal-steps">0</strong></div>
      </div>

      <label class="mt-4 flex items-center gap-3 bg-slate-50 rounded-xl p-3 border border-slate-200">
        <input id="keep-destination-toggle" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
        <span class="text-sm text-slate-700">Keep this destination for the next leg</span>
      </label>

      <div class="mt-4 space-y-2">
        <button id="btn-modal-next-leg" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold">Continue to next leg</button>
        <button id="btn-modal-new-destination" class="w-full bg-slate-200 text-slate-800 py-2 rounded-xl font-semibold">Set a new destination</button>
      </div>
    </div>
  </div>

  <script>
    const appState = {
      startCoords: null,
      endCoords: null,
      startAddress: '',
      endAddress: '',
      persistentDestinationCoords: null,
      persistentDestinationAddress: '',
      keepDestinationForNextLeg: false,
      currentLegDistance: 0,
      currentLegSeconds: 0,
      elapsedSeconds: 0,
      tracking: false,
      paused: false,
      startTime: null,
      pauseStartTime: null,
      pausedDuration: 0,
      walkedPathCoords: [],
      routeCoords: [],
      legNumber: 1,
      arrived: false,
      timerInterval: null,
      watchId: null,
      lastPosition: null,
      savedTrips: []
    };

    const DOM = {
      map: document.getElementById('map'),
      inputStart: document.getElementById('input-start'),
      inputEnd: document.getElementById('input-end'),
      btnCalcRoute: document.getElementById('btn-calc-route'),
      btnClearEnd: document.getElementById('btn-clear-end'),
      btnStartPause: document.getElementById('btn-start-pause'),
      btnStop: document.getElementById('btn-stop'),
      btnNextLeg: document.getElementById('btn-next-leg'),
      tripLegIndicator: document.getElementById('trip-leg-indicator'),
      routeSummaryCard: document.getElementById('route-summary-card'),
      summaryDistance: document.getElementById('summary-distance'),
      summaryTime: document.getElementById('summary-time'),
      summarySteps: document.getElementById('summary-steps'),
      arrivalModal: document.getElementById('arrival-modal'),
      modalDist: document.getElementById('modal-dist'),
      modalTime: document.getElementById('modal-time'),
      modalSteps: document.getElementById('modal-steps'),
      keepDestinationToggle: document.getElementById('keep-destination-toggle'),
      btnModalNextLeg: document.getElementById('btn-modal-next-leg'),
      btnModalNewDestination: document.getElementById('btn-modal-new-destination')
    };

    let map;
    let routePolyline;
    let walkedPolyline;
    let startMarker;
    let endMarker;
    let userMarker;

    function initMap() {
      map = L.map('map').setView([32.4315, -80.6698], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      routePolyline = L.polyline([], { color: '#2563eb', weight: 5, dashArray: '8,8' }).addTo(map);
      walkedPolyline = L.polyline([], { color: '#22c55e', weight: 6 }).addTo(map);

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const userCoords = [pos.coords.latitude, pos.coords.longitude];
          if (!appState.startCoords) {
            setStartLocation(userCoords, 'Current Location');
          }
          updateUserMarker(userCoords);
          map.setView(userCoords, 14);
        });
      }
    }

    function createStartIcon() {
      return L.divIcon({
        className: 'marker-start',
        html: '<div style="background:#10b981;width:20px;height:20px;border-radius:9999px;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,.3)"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    function createEndIcon() {
      return L.divIcon({
        className: 'marker-end',
        html: '<div style="background:#ef4444;width:20px;height:20px;border-radius:9999px;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,.3)"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    function createUserIcon() {
      return L.divIcon({
        className: 'marker-user',
        html: '<div class="pulse"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    function updateUserMarker(coords) {
      if (!userMarker) {
        userMarker = L.marker(coords, { icon: createUserIcon() }).addTo(map);
      } else {
        userMarker.setLatLng(coords);
      }
    }

    function setStartLocation(coords, label) {
      appState.startCoords = coords;
      appState.startAddress = label;
      DOM.inputStart.value = label;

      if (startMarker) map.removeLayer(startMarker);
      startMarker = L.marker(coords, { icon: createStartIcon() }).addTo(map);
      startMarker.bindPopup('<b>Start:</b> ' + label);

      if (appState.endCoords) {
        map.fitBounds(L.latLngBounds([appState.startCoords, appState.endCoords]), { padding: [40, 40] });
      }
    }

    function setEndLocation(coords, label) {
      appState.endCoords = coords;
      appState.endAddress = label;
      appState.persistentDestinationCoords = coords;
      appState.persistentDestinationAddress = label;
      DOM.inputEnd.value = label;

      if (endMarker) map.removeLayer(endMarker);
      endMarker = L.marker(coords, { icon: createEndIcon() }).addTo(map);
      endMarker.bindPopup('<b>Destination:</b> ' + label);

      if (appState.startCoords) {
        map.fitBounds(L.latLngBounds([appState.startCoords, appState.endCoords]), { padding: [40, 40] });
      }
    }

    function clearEndLocation() {
      appState.endCoords = null;
      appState.endAddress = '';
      appState.persistentDestinationCoords = null;
      appState.persistentDestinationAddress = '';
      DOM.inputEnd.value = '';
      if (endMarker) map.removeLayer(endMarker);
      routePolyline.setLatLngs([]);
      DOM.routeSummaryCard.classList.add('hidden');
    }

    function toKm(value) {
      return (value / 1000).toFixed(2) + ' km';
    }

    function toMiles(value) {
      return (value * 0.000621371).toFixed(2) + ' mi';
    }

    async function calculateWalkingRoute() {
      if (!appState.startCoords || !appState.endCoords) {
        alert('Please pick a start and destination first.');
        return;
      }

      const url = 'https://router.project-osrm.org/route/v1/foot/' +
        appState.startCoords[1] + ',' + appState.startCoords[0] + ';' +
        appState.endCoords[1] + ',' + appState.endCoords[0] +
        '?overview=full&geometries=geojson';

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length) {
          const route = data.routes[0];
          appState.routeCoords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          routePolyline.setLatLngs(appState.routeCoords);
          map.fitBounds(routePolyline.getBounds(), { padding: [45, 45] });

          const distanceText = toKm(route.distance);
          const timeMins = Math.round(route.duration / 60);
          const steps = Math.round(route.distance / 0.75);

          DOM.summaryDistance.textContent = distanceText;
          DOM.summaryTime.textContent = timeMins + ' mins';
          DOM.summarySteps.textContent = steps.toLocaleString();
          DOM.routeSummaryCard.classList.remove('hidden');
        }
      } catch (e) {
        const directDistance = getDistanceMeters(appState.startCoords, appState.endCoords);
        appState.routeCoords = [appState.startCoords, appState.endCoords];
        routePolyline.setLatLngs(appState.routeCoords);
        map.fitBounds(routePolyline.getBounds(), { padding: [45, 45] });

        DOM.summaryDistance.textContent = toKm(directDistance);
        DOM.summaryTime.textContent = Math.round(directDistance / 1000 / 1.3 * 60) + ' mins';
        DOM.summarySteps.textContent = Math.round(directDistance / 0.75).toLocaleString();
        DOM.routeSummaryCard.classList.remove('hidden');
      }
    }

    function getDistanceMeters(coordA, coordB) {
      const R = 6371000;
      const dLat = (coordB[0] - coordA[0]) * Math.PI / 180;
      const dLng = (coordB[1] - coordA[1]) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(coordA[0] * Math.PI / 180) *
        Math.cos(coordB[0] * Math.PI / 180) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function startWalk() {
      if (!appState.startCoords) {
        alert('Set a start location first.');
        return;
      }

      appState.tracking = true;
      appState.paused = false;
      appState.arrived = false;

      if (!appState.startTime) {
        appState.startTime = Date.now();
        appState.walkedPathCoords = [appState.startCoords];
        appState.currentLegDistance = 0;
        appState.elapsedSeconds = 0;
        walkedPolyline.setLatLngs(appState.walkedPathCoords);
      }

      appState.timerInterval = setInterval(updateMetrics, 1000);
      if ('geolocation' in navigator) {
        appState.watchId = navigator.geolocation.watchPosition((pos) => {
          if (appState.paused || appState.arrived) return;
          const newPt = [pos.coords.latitude, pos.coords.longitude];
          appState.lastPosition = newPt;

          if (appState.walkedPathCoords.length) {
            const last = appState.walkedPathCoords[appState.walkedPathCoords.length - 1];
            const delta = getDistanceMeters(last, newPt);
            if (delta > 1.5) {
              appState.currentLegDistance += delta;
            }
          }

          appState.walkedPathCoords.push(newPt);
          walkedPolyline.setLatLngs(appState.walkedPathCoords);
          updateUserMarker(newPt);
          map.panTo(newPt);
          checkDestinationArrival(newPt);
          updateMetrics();
        }, (err) => {
          console.error(err);
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 1000 });
      }

      DOM.btnStartPause.textContent = 'Pause';
      DOM.btnStop.classList.remove('hidden');
    }

    function pauseWalk() {
      if (!appState.tracking) return;
      appState.paused = true;
      clearInterval(appState.timerInterval);
      if (appState.watchId && navigator.geolocation) navigator.geolocation.clearWatch(appState.watchId);
      DOM.btnStartPause.textContent = 'Resume';
    }

    function resumeWalk() {
      if (!appState.tracking) return;
      appState.paused = false;
      appState.pauseStartTime = Date.now();
      appState.timerInterval = setInterval(updateMetrics, 1000);
      DOM.btnStartPause.textContent = 'Pause';
      startWalk();
    }

    function updateMetrics() {
      if (!appState.startTime || appState.paused) return;
      appState.elapsedSeconds = Math.floor((Date.now() - appState.startTime - appState.pausedDuration) / 1000);
      const mins = Math.floor(appState.elapsedSeconds / 60);
      const secs = appState.elapsedSeconds % 60;
      DOM.modalTime.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function checkDestinationArrival(currentPt) {
      if (!appState.endCoords || appState.arrived) return;
      const distToEnd = getDistanceMeters(currentPt, appState.endCoords);
      if (distToEnd <= 25) {
        appState.arrived = true;
        pauseWalk();
        showArrivalModal();
      }
    }

    function showArrivalModal() {
      const distance = appState.currentLegDistance || getDistanceMeters(appState.startCoords, appState.endCoords);
      const mins = Math.floor(appState.elapsedSeconds / 60);
      const secs = appState.elapsedSeconds % 60;

      DOM.modalDist.textContent = toKm(distance);
      DOM.modalTime.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      DOM.modalSteps.textContent = Math.round(distance / 0.75).toLocaleString();
      DOM.keepDestinationToggle.checked = appState.keepDestinationForNextLeg;
      DOM.arrivalModal.classList.remove('hidden');
      DOM.arrivalModal.classList.add('flex');
    }

    function hideArrivalModal() {
      DOM.arrivalModal.classList.add('hidden');
      DOM.arrivalModal.classList.remove('flex');
    }

    function completeLeg() {
      appState.keepDestinationForNextLeg = DOM.keepDestinationToggle.checked;
      hideArrivalModal();
      saveTripToHistory();

      if (appState.keepDestinationForNextLeg) {
        const previousDestination = {
          coords: [...appState.endCoords],
          address: appState.endAddress || 'Previous destination'
        };

        appState.startCoords = previousDestination.coords;
        appState.startAddress = previousDestination.address;
        DOM.inputStart.value = previousDestination.address;

        appState.endCoords = previousDestination.coords;
        appState.endAddress = previousDestination.address;
        DOM.inputEnd.value = previousDestination.address;

        appState.walkedPathCoords = [previousDestination.coords];
        appState.currentLegDistance = 0;
        appState.elapsedSeconds = 0;
        appState.startTime = null;
        appState.pausedDuration = 0;
        appState.paused = false;
        appState.tracking = false;
        appState.arrived = false;

        walkResetVisuals();
        DOM.tripLegIndicator.textContent = String(++appState.legNumber);
      } else {
        resetPlanner();
      }
    }

    function walkResetVisuals() {
      clearInterval(appState.timerInterval);
      if (appState.watchId && navigator.geolocation) navigator.geolocation.clearWatch(appState.watchId);
      walkedPolyline.setLatLngs([]);
      routePolyline.setLatLngs([]);
      DOM.routeSummaryCard.classList.add('hidden');
      DOM.btnStop.classList.add('hidden');
      DOM.btnStartPause.textContent = 'Start Walk';
    }

    function resetPlanner() {
      clearInterval(appState.timerInterval);
      if (appState.watchId && navigator.geolocation) navigator.geolocation.clearWatch(appState.watchId);

      appState.startCoords = null;
      appState.endCoords = null;
      appState.startAddress = '';
      appState.endAddress = '';
      appState.keepDestinationForNextLeg = false;
      appState.currentLegDistance = 0;
      appState.elapsedSeconds = 0;
      appState.tracking = false;
      appState.paused = false;
      appState.startTime = null;
      appState.walkedPathCoords = [];
      appState.legNumber = 1;
      appState.arrived = false;

      DOM.inputStart.value = '';
      DOM.inputEnd.value = '';
      DOM.tripLegIndicator.textContent = '1';
      DOM.btnStartPause.textContent = 'Start Walk';
      DOM.btnStop.classList.add('hidden');
      DOM.routeSummaryCard.classList.add('hidden');
      walkedPolyline.setLatLngs([]);
      routePolyline.setLatLngs([]);

      if (startMarker) map.removeLayer(startMarker);
      if (endMarker) map.removeLayer(endMarker);
      startMarker = null;
      endMarker = null;
    }

    function saveTripToHistory() {
      const trip = {
        leg: appState.legNumber,
        distance: appState.currentLegDistance || getDistanceMeters(appState.startCoords, appState.endCoords),
        time: appState.elapsedSeconds,
        timestamp: new Date().toLocaleString()
      };
      appState.savedTrips.push(trip);
      console.log('Trip saved:', trip);
    }

    DOM.btnCalcRoute.addEventListener('click', calculateWalkingRoute);
    DOM.btnClearEnd.addEventListener('click', clearEndLocation);
    DOM.btnStartPause.addEventListener('click', () => {
      if (!appState.tracking) {
        startWalk();
      } else if (appState.paused) {
        resumeWalk();
      } else {
        pauseWalk();
      }
    });
    DOM.btnStop.addEventListener('click', () => {
      clearInterval(appState.timerInterval);
      if (appState.watchId && navigator.geolocation) navigator.geolocation.clearWatch(appState.watchId);
      appState.tracking = false;
      appState.paused = false;
      DOM.btnStop.classList.add('hidden');
      DOM.btnStartPause.textContent = 'Start Walk';
      saveTripToHistory();
    });

    DOM.btnNextLeg.addEventListener('click', () => {
      if (!appState.endCoords) return;
      const nextStart = [...appState.endCoords];
      appState.startCoords = nextStart;
      appState.startAddress = appState.endAddress || 'Previous destination';
      DOM.inputStart.value = appState.startAddress;
      if (startMarker) map.removeLayer(startMarker);
      startMarker = L.marker(nextStart, { icon: createStartIcon() }).addTo(map);
      startMarker.bindPopup('<b>Start:</b> ' + appState.startAddress);
      appState.legNumber += 1;
      DOM.tripLegIndicator.textContent = appState.legNumber;
    });

    DOM.btnModalNextLeg.addEventListener('click', completeLeg);
    DOM.btnModalNewDestination.addEventListener('click', () => {
      appState.keepDestinationForNextLeg = false;
      DOM.keepDestinationToggle.checked = false;
      hideArrivalModal();
      clearEndLocation();
    });

    DOM.inputStart.addEventListener('change', () => {
      if (!DOM.inputStart.value.trim()) return;
      appState.startAddress = DOM.inputStart.value.trim();
    });

    DOM.inputEnd.addEventListener('change', () => {
      if (!DOM.inputEnd.value.trim()) return;
      const label = DOM.inputEnd.value.trim();
      const fallback = [32.4315, -80.6698];
      const coords = appState.endCoords || fallback;
      setEndLocation(coords, label);
    });

    initMap();
  </script>
</body>
</html>
