<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalkTrack - Persistent Destination</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WalkTrack" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #map { height: 100vh; }
    .leaflet-container { background: #dfeaf5; }
    .pulse {
      width: 18px; height: 18px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
      70% { box-shadow: 0 0 0 14px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
  </style>
</head>
<body class="bg-slate-100">
  <div class="flex flex-col h-screen">
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm z-20">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500 text-white p-2 rounded-xl"><span>🚶</span></div>
        <div>
          <h1 class="font-bold text-lg">WalkTrack</h1>
          <p class="text-xs text-slate-500">Persistent destination trips</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="final-destination-badge" class="text-xs bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full">Final: not set</div>
        <div class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Leg <span id="trip-leg-indicator">1</span></div>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <aside class="w-full max-w-md bg-white border-r border-slate-200 p-4 space-y-4 overflow-y-auto">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Start</label>
          <input id="input-start" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="Start location" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1">Destination</label>
          <input id="input-end" type="text" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" placeholder="End location" />
        </div>

        <div id="current-goal-box" class="rounded-xl border border-slate-200 bg-slate-50 p-2 text-xs text-slate-600">
          <div class="font-bold uppercase tracking-wide text-slate-500">Current goal</div>
          <div id="current-goal-label" class="mt-1 font-semibold text-slate-700">Not set</div>
        </div>

        <div class="flex gap-2">
          <button id="btn-calc-route" class="flex-1 bg-slate-800 text-white py-2 rounded-xl font-semibold">Calculate Route</button>
          <button id="btn-clear-end" class="bg-slate-200 text-slate-700 px-3 rounded-xl">Clear</button>
        </div>

        <div id="route-summary-card" class="hidden rounded-2xl border border-emerald-200 bg-emerald-50 p-3">
          <div class="flex justify-between items-center pb-2 border-b border-emerald-200">
            <span class="text-xs font-bold uppercase text-emerald-700">Route</span>
            <span id="summary-distance" class="font-black text-emerald-700">0.0 km</span>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
            <div>
              <div class="text-slate-500">Est. time</div>
              <div id="summary-time" class="font-bold text-slate-700">0 mins</div>
            </div>
            <div>
              <div class="text-slate-500">Est. steps</div>
              <div id="summary-steps" class="font-bold text-slate-700">0</div>
            </div>
          </div>
        </div>

        <div class="flex gap-2">
          <button id="btn-start-pause" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold">Start Walk</button>
          <button id="btn-stop" class="hidden bg-red-600 text-white px-4 py-2 rounded-xl font-bold">Finish</button>
        </div>

        <button id="btn-next-leg" class="w-full bg-slate-200 text-slate-800 py-2 rounded-xl font-semibold">Set End as New Start</button>
      </aside>

      <main class="relative flex-1">
        <div id="map"></div>
      </main>
    </div>
  </div>

  <div id="arrival-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex justify-center mb-4">
        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl">🏆</div>
      </div>
      <h2 class="text-center text-2xl font-black text-slate-800">Destination Reached!</h2>
      <p class="text-center text-sm text-slate-500 mt-2">You made it to your destination for this leg.</p>
      <div class="bg-slate-50 rounded-2xl p-3 mt-4 text-xs space-y-1">
        <div class="flex justify-between">
          <span class="text-slate-600">Distance</span>
          <span class="font-bold text-slate-800" id="modal-distance">0.0 km</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-600">Duration</span>
          <span class="font-bold text-slate-800" id="modal-duration">0:00</span>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <button id="btn-modal-next" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-semibold">Next Leg</button>
        <button id="btn-modal-finish" class="flex-1 bg-slate-200 text-slate-800 py-2 rounded-xl font-semibold">Finish Trip</button>
      </div>
    </div>
  </div>

  <script>
    // Service Worker Registration - REQUIRED for PWA installability
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('✓ Service Worker registered', reg);
      }).catch(err => {
        console.error('✗ Service Worker failed:', err);
      });
    }

    // Rest of the app code...
    const state = {
      tracking: false,
      leg: 1,
      startCoords: null,
      endCoords: null,
      calculatedRouteCoords: [],
      distanceMeters: 0,
      startTime: null
    };

    const DOM = {
      inputStart: document.getElementById('input-start'),
      inputEnd: document.getElementById('input-end'),
      btnCalcRoute: document.getElementById('btn-calc-route'),
      btnStartPause: document.getElementById('btn-start-pause'),
      btnStop: document.getElementById('btn-stop'),
      btnNextLeg: document.getElementById('btn-next-leg'),
      btnClearEnd: document.getElementById('btn-clear-end'),
      currentGoalLabel: document.getElementById('current-goal-label'),
      finalDestinationBadge: document.getElementById('final-destination-badge'),
      tripLegIndicator: document.getElementById('trip-leg-indicator'),
      routeSummaryCard: document.getElementById('route-summary-card'),
      summaryDistance: document.getElementById('summary-distance'),
      summaryTime: document.getElementById('summary-time'),
      summarySteps: document.getElementById('summary-steps'),
      arrivalModal: document.getElementById('arrival-modal'),
      modalDistance: document.getElementById('modal-distance'),
      modalDuration: document.getElementById('modal-duration'),
      btnModalNext: document.getElementById('btn-modal-next'),
      btnModalFinish: document.getElementById('btn-modal-finish')
    };

    let map = null;
    let routeLine = null;
    let userMarker = null;
    let startMarker = null;
    let endMarker = null;

    function initMap() {
      map = L.map('map').setView([32.43, -80.67], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      
      routeLine = L.polyline([], { color: '#3b82f6', weight: 4, dashArray: '5,5' }).addTo(map);
      
      map.on('click', (e) => {
        const coords = [e.latlng.lat, e.latlng.lng];
        if (!state.startCoords) {
          setStart(coords);
        } else if (!state.endCoords) {
          setEnd(coords);
        }
      });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const userCoords = [pos.coords.latitude, pos.coords.longitude];
          if (!state.startCoords) setStart(userCoords);
          updateUserMarker(userCoords);
        });
      }
    }

    function setStart(coords) {
      state.startCoords = coords;
      DOM.inputStart.value = `${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}`;
      if (startMarker) map.removeLayer(startMarker);
      startMarker = L.marker(coords, { icon: L.icon({ iconUrl: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="%2310b981"/><text x="15" y="18" text-anchor="middle" fill="white" font-size="16" font-weight="bold">S</text></svg>', iconSize: [30, 30] }) }).addTo(map);
      updateUserMarker(coords);
    }

    function setEnd(coords) {
      state.endCoords = coords;
      DOM.inputEnd.value = `${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}`;
      if (endMarker) map.removeLayer(endMarker);
      endMarker = L.marker(coords, { icon: L.icon({ iconUrl: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="%23ef4444"/><text x="15" y="18" text-anchor="middle" fill="white" font-size="16" font-weight="bold">E</text></svg>', iconSize: [30, 30] }) }).addTo(map);
      DOM.finalDestinationBadge.textContent = `Final: ${coords[0].toFixed(2)}, ${coords[1].toFixed(2)}`;
      updateCurrentGoal();
    }

    function updateUserMarker(coords) {
      if (!userMarker) {
        userMarker = L.marker(coords, { icon: L.icon({ iconUrl: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="%2322c55e"/></svg>', iconSize: [20, 20] }) }).addTo(map);
      } else {
        userMarker.setLatLng(coords);
      }
    }

    function updateCurrentGoal() {
      if (state.endCoords) {
        DOM.currentGoalLabel.textContent = `Leg ${state.leg}: ${state.endCoords[0].toFixed(2)}, ${state.endCoords[1].toFixed(2)}`;
      }
    }

    async function calculateRoute() {
      if (!state.startCoords || !state.endCoords) return alert('Set both start and end');

      const [lat1, lng1] = state.startCoords;
      const [lat2, lng2] = state.endCoords;

      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`);
        const data = await res.json();
        
        if (data.routes?.[0]) {
          const route = data.routes[0];
          state.calculatedRouteCoords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          const dist = route.distance;
          const mins = Math.round(route.duration / 60);
          const steps = Math.round(dist / 0.75);

          routeLine.setLatLngs(state.calculatedRouteCoords);
          map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

          DOM.summaryDistance.textContent = `${(dist / 1000).toFixed(2)} km`;
          DOM.summaryTime.textContent = `${mins} mins`;
          DOM.summarySteps.textContent = `${steps.toLocaleString()} steps`;
          DOM.routeSummaryCard.classList.remove('hidden');
        }
      } catch (e) {
        console.error('Route error:', e);
      }
    }

    function startWalk() {
      if (!state.startCoords) return alert('Set start location');
      state.tracking = true;
      state.startTime = Date.now();
      state.distanceMeters = 0;
      DOM.btnStartPause.textContent = 'Pause';
      DOM.btnStop.classList.remove('hidden');
      
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          if (!state.tracking) return;
          const coords = [pos.coords.latitude, pos.coords.longitude];
          updateUserMarker(coords);
          
          if (state.endCoords) {
            const dist = getDistance(coords, state.endCoords);
            if (dist < 20) {
              pauseWalk();
              showArrivalModal();
            }
          }
        });
      }
    }

    function pauseWalk() {
      state.tracking = false;
      DOM.btnStartPause.textContent = 'Resume';
    }

    function stopWalk() {
      state.tracking = false;
      DOM.btnStartPause.textContent = 'Start Walk';
      DOM.btnStop.classList.add('hidden');
    }

    function getDistance(coord1, coord2) {
      const R = 6371000;
      const dLat = (coord2[0] - coord1[0]) * Math.PI / 180;
      const dLng = (coord2[1] - coord1[1]) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(coord1[0] * Math.PI / 180) * Math.cos(coord2[0] * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function showArrivalModal() {
      DOM.arrivalModal.classList.remove('hidden');
      DOM.arrivalModal.classList.add('flex');
    }

    function nextLeg() {
      state.leg++;
      state.startCoords = state.endCoords;
      state.endCoords = null;
      DOM.inputStart.value = DOM.inputEnd.value;
      DOM.inputEnd.value = '';
      DOM.tripLegIndicator.textContent = state.leg;
      DOM.routeSummaryCard.classList.add('hidden');
      DOM.btnStartPause.textContent = 'Start Walk';
      DOM.btnStop.classList.add('hidden');
      state.tracking = false;
      DOM.arrivalModal.classList.add('hidden');
      DOM.arrivalModal.classList.remove('flex');
      updateCurrentGoal();
    }

    // Event Listeners
    DOM.btnCalcRoute.addEventListener('click', calculateRoute);
    DOM.btnStartPause.addEventListener('click', () => state.tracking ? pauseWalk() : startWalk());
    DOM.btnStop.addEventListener('click', stopWalk);
    DOM.btnNextLeg.addEventListener('click', nextLeg);
    DOM.btnClearEnd.addEventListener('click', () => {
      state.endCoords = null;
      DOM.inputEnd.value = '';
      if (endMarker) map.removeLayer(endMarker);
      DOM.routeSummaryCard.classList.add('hidden');
    });
    DOM.btnModalNext.addEventListener('click', nextLeg);
    DOM.btnModalFinish.addEventListener('click', () => {
      DOM.arrivalModal.classList.add('hidden');
      DOM.arrivalModal.classList.remove('flex');
      location.reload();
    });

    // Initialize
    initMap();
    updateCurrentGoal();
  </script>
</body>
</html>
